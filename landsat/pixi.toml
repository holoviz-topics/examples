[workspace]
name = "landsat"
channels = ["conda-forge"]
platforms = ["linux-64", "win-64", "osx-arm64"]

[tool.metadata]
created = "2016-06-20"
maintainers = ["jbednar"]
categories = ["Geospatial"]
labels = ["geoviews", "holoviews", "bokeh", "datashader", "numba", "xarray"]
description = "Datashading LandSat8 raster satellite imagery"

[dependencies]
python = "*"
notebook = "*"
bokeh = "*"
cartopy = "*"
datashader = "*"
geoviews = "*"
holoviews = "*"
numpy = "*"
pandas = "*"
rasterio = "*"
xarray = "*"
numba = "*"
param = "*"
rioxarray = "*"
jupyter_client = "<8"
pip = "*"  # promoted from anaconda-project lock
wheel = "*"  # promoted from anaconda-project lock

[tasks.notebook]
cmd = "jupyter notebook landsat.ipynb"
depends-on = ["download"]

[tasks.download]
env = { FILENAME = "data" }
cmd = "mkdir -p $FILENAME && curl -fsSL -o .DATA.zip http://s3.amazonaws.com/datashader-data/mobile_landsat8.zip && python -m zipfile -e .DATA.zip $FILENAME && rm .DATA.zip"
outputs = ["data"]

[feature.test.dependencies]
pytest = "*"
nbval = "*"

[feature.test.tasks]
test = { cmd = "pytest --nbval-lax --nbval-cell-timeout=3600 -x *.ipynb", depends-on = ["download"] }
download = { cmd = "mkdir -p data && cp -r ../test_data/landsat/. data/", outputs = ["data/**"] }

[environments]
default = { solve-group = "default" }
test = { features = ["test"], solve-group = "default" }
