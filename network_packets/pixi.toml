[workspace]
name = "network_packets"
channels = ["main", "msys2"]
platforms = ["linux-64", "win-64", "osx-arm64"]

[tool.metadata]
created = "2017-07-24"
maintainers = ["jbcrail", "jbednar"]
categories = ["Cybersecurity"]
labels = ["holoviews", "bokeh", "datashader", "networkx"]
description = "Graphing network packets using networkx, holoviews, and datashader"

[dependencies]
python = "3.9.*"
notebook = "*"
bokeh = "2.3.3.*"
colorcet = "*"
dask = "2021.9.1.*"
datashader = "0.13.0.*"
fastparquet = "0.5.0.*"
holoviews = "1.14.5.*"
networkx = "*"
scikit-image = "*"
python-snappy = "0.6.0.*"
pandas = "*"
param = "1.11.1.*"
numpy = "1.21.*"
numba = "0.55.*"
panel = "0.12.1.*"
jinja2 = "<3"
markupsafe = "2.0.1.*"
pyviz_comms = "2.0.2.*"
scipy = "1.9.*"
pip = "*"  # promoted from anaconda-project lock
wheel = "*"  # promoted from anaconda-project lock

[target.osx-arm64.dependencies]
libgfortran = "*"  # promoted from anaconda-project lock

[tasks.notebook]
cmd = "jupyter notebook network_packets.ipynb"
depends-on = ["download"]

[tasks.prepare_data]
cmd = "python pcap_to_parquet.py maccdc2012_00000.txt"
depends-on = ["download"]

[tasks.download]
env = { FILENAME = "data" }
cmd = "mkdir -p $FILENAME && curl -fsSL -o .DATA.zip http://s3.amazonaws.com/datashader-data/maccdc2012_graph.zip && python -m zipfile -e .DATA.zip $FILENAME && rm .DATA.zip"
outputs = ["data"]

[feature.test]
channels = [{ channel = "conda-forge", priority = -1 }]

[feature.test.dependencies]
pytest = "*"
nbval = { version = "*", channel = "conda-forge" }

[feature.test.tasks]
test = { cmd = "pytest --nbval-lax --nbval-cell-timeout=3600 -x *.ipynb", depends-on = ["download"] }
download = { cmd = "mkdir -p data && cp -r ../test_data/network_packets/. data/", outputs = ["data/**"] }

[environments]
default = { solve-group = "default" }
test = { features = ["test"], solve-group = "default" }
