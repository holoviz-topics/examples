[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-v --pyargs --doctest-modules --doctest-ignore-import-errors --color=yes"
norecursedirs = "doc .git dist build _build .ipynb_checkpoints apps"
filterwarnings = [
    "error",
    "ignore::nbformat.warnings.MissingIDFieldWarning",
    # zmq/asyncio socket + event-loop teardown noise in the Jupyter kernel,
    # surfaced as unraisable exceptions unrelated to the notebooks themselves.
    "ignore::ResourceWarning",
    "ignore:There is no current event loop:DeprecationWarning",
    "ignore:Exception ignored in. <function BaseEventLoop.__del__:pytest.PytestUnraisableExceptionWarning",
]

[tool.ruff]
target-version = "py311"

[tool.ruff.format]
exclude = ["*.ipynb", "*.md"]

[tool.ruff.lint]
select = ["F"]

[tool.typos.default]
extend-ignore-re = [
    ".*(?:#|--|//|/*).*(?:typos):\\s?ignore[^\\n]*\\n",
    ".*(?:typos):\\s?ignore-next-line[^\\n]*\\n[^\\n]*",
]

[tool.typos.default.extend-words]
arange = "arange"
lod = "lod"
nd = "nd"
pn = "pn"
ser = "ser"
spreaded = "spreaded"
writeable = "writeable"
# carbon_flux
sav = "sav"
# iex_stocks
panc = "panc"
hpe = "hpe"
