[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-v --pyargs --doctest-modules --doctest-ignore-import-errors --color=yes"
norecursedirs = "doc .git dist build _build .ipynb_checkpoints apps"
filterwarnings = [
    "error",
    "ignore::nbformat.warnings.MissingIDFieldWarning",
    # zmq/asyncio socket + event-loop teardown noise in the Jupyter kernel,
    # surfaced as unraisable exceptions unrelated to the notebooks themselves.
    "ignore::ResourceWarning",
    "ignore:There is no current event loop:DeprecationWarning",
]

[tool.ruff]
target-version = "py311"

[tool.ruff.format]
exclude = ["*.ipynb", "*.md"]

[tool.ruff.lint]
select = ["F"]
