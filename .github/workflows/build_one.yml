name: build one

on:
  workflow_call:
    inputs:
      project:
        description: Project to test
        required: true
        type: string
      type:
        description: hack
        required: true
        type: string
      branch:
        description: Branch suffix to push the evaluated projects to
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      project:
        description: Project to build (dryrun only)
        required: true
        type: string

jobs:
  build_one:
    name: build ${{ inputs.project }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2
      with:
        manifest-path: ${{ inputs.project }}/pixi.toml
        environments: default
        cache: false
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: "3.12"
    - name: resolve data cache key
      id: detect
      env:
        PROJECT: ${{ inputs.project }}
      run: |
        version=$(grep -E '^[[:space:]]*data_version[[:space:]]*=' "$PROJECT/pixi.toml" | head -1 \
          | sed -E 's/^[^=]*=[[:space:]]*//; s/[[:space:]]*(#.*)?$//; s/^"//; s/"$//')
        if [ -n "$version" ]; then
          echo "cache=true" >> "$GITHUB_OUTPUT"
          echo "cache_key=data-$PROJECT-$version" >> "$GITHUB_OUTPUT"
        else
          echo "cache=false" >> "$GITHUB_OUTPUT"
        fi
    # Saved by test_one.yml, which runs before the build in pr_flow.yml.
    - name: restore data cache
      if: steps.detect.outputs.cache == 'true'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ${{ inputs.project }}/data
          ${{ inputs.project }}/.pixi/task-cache-v*
          ~/.intake
        key: ${{ steps.detect.outputs.cache_key }}
    - name: build project
      env:
        PROJECT: ${{ inputs.project }}
      run: python scripts/build_project.py "$PROJECT"
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ inputs.project }}
        path: doc/gallery/${{ inputs.project }}/
        retention-days: 3
    - name: deploy project
      # Only push to the branch when the workflow is called by pr_flow.yml -> build.yml
      # Could be updated to allow to build projects using worfklow_dispatch to see
      # the evaluated output of a project.
      if: inputs.type == 'workflow_call'
      env:
        DIR: ${{ inputs.project }}
        BRANCH: ${{ inputs.branch }}
      run: |
        # Create local branch to switch back to it later, before cleaning up and diffing
        git checkout -b local_branch_qpeori

        BRANCHNAME="tmp_evaluated_fghgf_${BRANCH}"
        REPO_URL="https://github.com/${GITHUB_REPOSITORY}.git"
        git config user.email "github-actions@github.com"
        git config user.name "github-actions"

        # Move doc to move to a tmp directory
        mv ./doc/gallery/$DIR ./tmp


        # Checkout tmp dev branch
        if git ls-remote --exit-code --heads "$REPO_URL" "$BRANCHNAME"
        then
            echo "Remote branch already there, fetching $BRANCHNAME"
            git fetch $REPO_URL $BRANCHNAME:refs/remotes/$BRANCHNAME
            git checkout $BRANCHNAME
            git log --oneline
        else
            echo "Remote branch not found"
            git switch --orphan $BRANCHNAME
        fi

        mkdir -p doc/gallery
        git diff --name-only
        if [ -d  ./doc/gallery/$DIR ]; then rm -rf ./doc/gallery/$DIR; fi
        mkdir ./doc/gallery/$DIR
        mv ./tmp/* ./doc/gallery/$DIR
        rmdir ./tmp
        git add ./doc/gallery/$DIR
        git commit -m "adding $DIR"
        echo "git status"
        git status
        echo "git push"
        git push -u origin HEAD:$BRANCHNAME
        git checkout local_branch_qpeori
    - name: check clean up
      run: |
        git diff --name-only
        git diff --quiet --exit-code
