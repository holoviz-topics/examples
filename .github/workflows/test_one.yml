name: test one

on:
  # Make it a reusable workflow
  workflow_call:
    inputs:
      project:
        description: Project to test
        required: true
        type: string
  # Run it from the UI
  workflow_dispatch:
    inputs:
      project:
        description: Project to test
        required: true

permissions: {}

concurrency:
  group: ${{ github.event.pull_request.number || github.ref }}-${{ inputs.project }}
  cancel-in-progress: true

jobs:
  test_one:
    name: test ${{ inputs.project }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup-project
        id: setup
        with:
          project: ${{ inputs.project }}
          environment: test
      - name: validate project file
        env:
          EXAMPLES_HOLOVIZ_WARNING_AS_ERROR: 1
          PROJECT: ${{ inputs.project }}
        run: python scripts/validate_project.py "$PROJECT"
      - name: test project
        env:
          PROJECT: ${{ inputs.project }}
          PYDEVD_DISABLE_FILE_VALIDATION: 1
        run: pixi run --manifest-path $PROJECT/pixi.toml -e test test
      - name: save data cache
        if: steps.setup.outputs.cache-key != '' && steps.setup.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.setup.outputs.cache-paths }}
          key: ${{ steps.setup.outputs.cache-key }}
      - name: check clean up
        run: |
          git diff --name-only
          git diff --quiet --exit-code
