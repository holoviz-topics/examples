name: test one

on:
  # Make it a reusable workflow
  workflow_call:
    inputs:
      project:
        description: Project to test
        required: true
        type: string
  # Run it from the UI
  workflow_dispatch:
    inputs:
      project:
        description: Project to test
        required: true

permissions: {}

concurrency:
  group: ${{ github.event.pull_request.number || github.ref }}-${{ inputs.project }}
  cancel-in-progress: true

jobs:
  test_one:
    name: test ${{ inputs.project }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2
        with:
          manifest-path: ${{ inputs.project }}/pixi.toml
          environments: test
          cache: false
      - name: resolve data cache key
        id: detect
        env:
          PROJECT: ${{ inputs.project }}
        run: |
          version=$(grep -E '^[[:space:]]*data_version[[:space:]]*=' "$PROJECT/pixi.toml" | head -1 \
            | sed -E 's/^[^=]*=[[:space:]]*//; s/[[:space:]]*(#.*)?$//; s/^"//; s/"$//')
          if [ -n "$version" ]; then
            echo "cache=true" >> "$GITHUB_OUTPUT"
            echo "cache_key=data-$PROJECT-$version" >> "$GITHUB_OUTPUT"
          else
            echo "cache=false" >> "$GITHUB_OUTPUT"
          fi
      - name: restore data cache
        id: data-cache
        if: steps.detect.outputs.cache == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ inputs.project }}/data
            ${{ inputs.project }}/.pixi/task-cache-v*
            ~/.intake
          key: ${{ steps.detect.outputs.cache_key }}
      - name: test project
        env:
          PROJECT: ${{ inputs.project }}
        run: pixi run --manifest-path $PROJECT/pixi.toml -e test test
      - name: save data cache
        if: steps.detect.outputs.cache == 'true' && steps.data-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ inputs.project }}/data
            ${{ inputs.project }}/.pixi/task-cache-v*
            ~/.intake
          key: ${{ steps.detect.outputs.cache_key }}
      - name: check clean up
        run: |
          git diff --name-only
          git diff --quiet --exit-code
