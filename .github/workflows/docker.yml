# Build a container image serving the `dashboard` task of each project.
#
# Runs on:
# - workflow_call (from pr_flow.yml, after the tests): build the images of the
#   projects changed in the PR (NOT pushed)
# - push to main: build the images of the projects changed by the last commit
#   and push them to ghcr.io/<repo>/<project>:latest
# - workflow_dispatch: build all or the listed projects, pushed only on main

name: docker

on:
  workflow_call:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      all:
        description: all the projects
        type: boolean
        default: false
        required: true
      projects:
        description: comma-separated list
        type: string
        required: false

permissions: {}

concurrency:
  group: docker-${{ github.event.pull_request.number || github.ref }}
  # Don't cancel on main, where a cancelled run would skip publishing its projects.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Find projects
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      projects: ${{ steps.set-projects.outputs.projects }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 100
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: infer project list
        id: set-projects
        env:
          ALL: ${{ inputs.all }}
          INPUTS: ${{ inputs.projects }}
        run: |
          # Only projects with a `dashboard` task get an image. datashader_dashboard
          # downloads its data through other projects, so it can't be built alone,
          # and template is only an example of how to write a project.
          FILTER="--task dashboard --exclude datashader_dashboard,template"
          CHANGED="--changed --exclude-website-metadata"
          if [ "$GITHUB_EVENT_NAME" == "pull_request" ]; then
            PROJECTS=$(python scripts/list_projects.py $CHANGED $FILTER | jq -c '.changed')
          elif [ "$GITHUB_EVENT_NAME" == "push" ]; then
            PROJECTS=$(python scripts/list_projects.py $CHANGED --last-commit $FILTER | jq -c '.changed')
          elif [ "$ALL" == "true" ]; then
            PROJECTS=$(python scripts/list_projects.py $FILTER)
          else
            PROJECTS=$(python scripts/list_projects.py --projects "$INPUTS" $FILTER)
          fi
          echo "Projects: $PROJECTS"
          echo "projects=$PROJECTS" >> $GITHUB_OUTPUT

  build:
    needs: [changes]
    if: needs.changes.outputs.projects != '[]'
    name: ${{ matrix.project }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJson(needs.changes.outputs.projects) }}
    permissions:
      # To push the image to GHCR, only done on main.
      packages: write
    env:
      PUBLISH: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0
      # - name: Log in to GHCR
      #   if: env.PUBLISH == 'true'
      #   uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
      #   with:
      #     registry: ghcr.io
      #     username: ${{ github.actor }}
      #     password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          provenance: false
          context: .
          file: Dockerfile
          build-args: |
            EXAMPLE=${{ matrix.project }}
          push: ${{ env.PUBLISH == 'true' }}
          tags: ghcr.io/${{ github.repository }}/${{ matrix.project }}:latest
