# Allows to test multiple projects in a matrix.
# - found out which projects to test
# - if any, test them in a matrix

# This runs on:
# - workflow_call: this is used by pr_flow.yml to test multiple projects
# - workflow_dispatch: to manually trigger tests
# - schedule: once a month for all of them

name: test multiple
on:
  workflow_call:
    inputs:
      projects:
        description: JSON-like list of projects
        type: string
        required: true
      type:
        description: hack
        type: string
        required: true
  workflow_dispatch:
    inputs:
      all:
        description: all the projects
        type: boolean
        default: false
        required: true
      projects:
        description: comma-separated list
        type: string
        required: false
  schedule:
    # 3rd day of the month at 2 (avoiding 1st day that may have more load)
    - cron: "0 2 3 * *"

permissions: {}

concurrency:
  group: test-multiple-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  inferprojects:
    runs-on: "ubuntu-latest"
    timeout-minutes: 10
    outputs:
      projects: ${{ steps.set-projects.outputs.projects }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/list-projects
        id: set-projects
        with:
          type: ${{ inputs.type }}
          all: ${{ inputs.all }}
          projects: ${{ inputs.projects }}
  test:
    needs: inferprojects
    if: needs.inferprojects.outputs.projects != '[]'
    name: Test projects
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJson(needs.inferprojects.outputs.projects) }}
    uses: $/.github/workflows/test_one.yml
    with:
      project: ${{ matrix.project }}
