# Allows to build multiple projects in a matrix.
# - found out which projects to build
# - if any, build them in a matrix

# This runs on:
# - workflow_call: this is used by pr_flow.yml to build multiple projects (PUSHING the results to a branch)
# - workflow_dispatch: to manually trigger builds (NOT pushing the results to any branch),
#   optionally listing the projects targeted 
# - schedule: once a month for all of them (NOT pushing the results to any branch)

name: build multiple
on:
  workflow_call:
    inputs:
      projects:
        description: JSON-like list of projects
        type: string
        required: false
      type:
        description: hack
        type: string
        required: true
      branch:
        description: Branch suffix to push the evaluated projects to
        type: string
        required: true
        default: ''
    # To be used by pr_flow and passed down to the workflow
    # that builds the docs.
    outputs:
      projects:
        description: "Projects to build"
        value: ${{ jobs.inferprojects.outputs.projects }}
  # Can be run from GH UI
  workflow_dispatch:
    inputs:
      all:
        description: all the projects
        type: boolean
        default: false
        required: true
      projects:
        description: comma-separated list
        type: string
        required: false
  schedule:
  # 3rd day of the month at 12 (avoiding 1st day that may have more load)
  - cron: '0 12 3 * *'

jobs:
  inferprojects:
    runs-on: 'ubuntu-latest'
    timeout-minutes: 10
    outputs:
      projects: ${{ steps.set-projects.outputs.projects }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: $/.github/actions/list-projects
      id: set-projects
      with:
        type: ${{ inputs.type }}
        all: ${{ inputs.all }}
        projects: ${{ inputs.projects }}
  build:
    needs: inferprojects
    if: needs.inferprojects.outputs.projects != '[]'
    name: Build ${{ matrix.project }}
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJson(needs.inferprojects.outputs.projects) }}
    uses: $/.github/workflows/build_one.yml
    with:
      project: ${{ matrix.project }}
  # One push after all builds, as parallel pushes to the same branch would race.
  push_evaluated:
    needs: [inferprojects, build]
    if: inputs.type == 'workflow_call'
    name: Push evaluated projects
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        path: ${{ runner.temp }}/gallery
    - name: push to the tmp evaluated branch
      env:
        BRANCH: ${{ inputs.branch }}
        GALLERY: ${{ runner.temp }}/gallery
        PROJECTS: ${{ needs.inferprojects.outputs.projects }}
      run: |
        BRANCHNAME="tmp_evaluated_fghgf_${BRANCH}"
        REPO_URL="https://github.com/${GITHUB_REPOSITORY}.git"
        git config user.email "github-actions@github.com"
        git config user.name "github-actions"

        if git ls-remote --exit-code --heads "$REPO_URL" "$BRANCHNAME"; then
          echo "Remote branch already there, fetching $BRANCHNAME"
          git fetch "$REPO_URL" "$BRANCHNAME:refs/remotes/$BRANCHNAME"
          git checkout "$BRANCHNAME"
        else
          echo "Remote branch not found"
          git switch --orphan "$BRANCHNAME"
        fi

        mkdir -p doc/gallery
        for DIR in $(echo "$PROJECTS" | jq -r '.[]'); do
          rm -rf "doc/gallery/$DIR"
          mv "$GALLERY/$DIR" "doc/gallery/$DIR"
          git add "doc/gallery/$DIR"
        done
        if git diff --cached --quiet; then
          echo "No changes to push"
          exit 0
        fi
        git commit -m "adding $(echo "$PROJECTS" | jq -r 'join(", ")')"
        git push -u origin "HEAD:$BRANCHNAME"
